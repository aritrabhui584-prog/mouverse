<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <!-- Gradient for the neon glow -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    
    <!-- Neon glow filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(5, 5)">
    <!-- EMBLEM: Stylized M + Play Button + Outer Glowing Polygon -->
    <g transform="translate(0, 0)">
      <!-- Outer Hexagon ring with neon glow -->
      <polygon points="20,0 37,10 37,30 20,40 3,30 3,10" fill="none" stroke="url(#neonGrad)" stroke-width="2" filter="url(#glowEffect)" opacity="0.8" />
      
      <!-- Inner Play Triangle -->
      <path d="M 15 13 L 28 20 L 15 27 Z" fill="url(#neonGrad)" filter="url(#glowEffect)" />
      
      <!-- M-shaped side bars -->
      <path d="M 7 10 L 7 30 L 11 28 L 11 12 Z" fill="url(#neonGrad)" opacity="0.5" />
      <polygon points="33,10 33,30 29,28 29,12" fill="url(#neonGrad)" opacity="0.5" />
    </g>

    <!-- TEXT: "MOUVERSE" (Bold Sans-Serif) -->
    <text x="50" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="3" filter="url(#glowEffect)">MOUVERSE</text>
    
    <!-- TEXT: "AI" (Neon Badge) -->
    <g transform="translate(192, 9)">
      <!-- Glassmorphic background for the AI badge -->
      <rect x="0" y="0" width="34" height="20" rx="6" fill="rgba(0, 217, 255, 0.08)" stroke="#00d9ff" stroke-width="1.2" filter="url(#glowEffect)" />
      <text x="17" y="14" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#00d9ff" text-anchor="middle" letter-spacing="1">AI</text>
    </g>
  </g>
</svg>
